<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CiteTable</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='2' y='2' width='28' height='28' rx='7' fill='%23ea580c'/%3E%3Ccircle cx='14' cy='14' r='6' fill='none' stroke='%23ffffff' stroke-width='3'/%3E%3Cpath d='M18.5 18.5l6 6' stroke='%23ffffff' stroke-width='3' stroke-linecap='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
  <header>
    <span class="head-side" aria-hidden="true"></span>
    <a class="brand" href="https://github.com/srikarprabhaskandagatla/agentic-ai-search" target="_blank" rel="noopener" title="View the code on GitHub">
      <h1>CiteTable</h1>
    </a>
    <div class="head-controls">
      <!--
      <div class="pop">
        <button class="tbtn" id="api-toggle" aria-expanded="false" aria-controls="api-panel">Backend
          <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <form class="api-panel glass" id="api-panel" hidden>
          <label for="api-input">API URL</label>
          <div class="row">
            <input type="text" id="api-input" spellcheck="false" autocomplete="off">
            <button type="submit" class="primary">Save</button>
          </div>
          <p class="muted" id="api-note">Default is http://localhost:8000</p>
        </form>
      </div>
      -->
      <button class="tbtn icon-btn" id="theme-toggle" aria-label="Theme" title="Theme"></button>
    </div>
  </header>

  <main>
    <section class="search" aria-label="Search">
      <h2 class="hero">Ask a Question. Get a table with sources.</h2>
      <p class="sub">The agent searches the web and links every value to its source.</p>
      <form class="ask" id="search-form">
        <textarea id="query" rows="2" placeholder="Ask for a list, like AI startups in healthcare" aria-label="Topic to search"></textarea>
        <div class="ask-bar">
          <div class="seg" id="depth" role="radiogroup" aria-label="Search depth">
            <button type="button" role="radio" data-depth="1" aria-checked="true" title="1 round">Fast</button>
            <button type="button" role="radio" data-depth="2" aria-checked="false" title="2 rounds">Agentic</button>
            <button type="button" role="radio" data-depth="3" aria-checked="false" title="3 rounds">Thorough</button>
          </div>
          <button type="submit" class="go" id="search-btn" aria-label="Search" title="Search"></button>
        </div>
      </form>
      <ul class="qlist" id="examples"></ul>
    </section>

    <section class="panel progress" id="progress" aria-live="polite" hidden>
      <ol class="steps" id="steps"></ol>
      <div class="bar"><span id="bar-fill"></span></div>
      <div class="status">
        <span class="spinner" id="spinner" aria-hidden="true"></span>
        <div>
          <p id="status-msg"></p>
          <p class="muted" id="status-detail"></p>
        </div>
      </div>
    </section>

    <section class="notice error" id="error" role="alert" hidden>
      <b>Search failed.</b> <span id="error-msg"></span>
    </section>

    <section class="panel results" id="results" aria-label="Results" hidden>
      <div class="results-head">
        <div>
          <h2 id="results-title"></h2>
          <p class="muted" id="results-meta"></p>
        </div>
        <div class="actions">
          <button id="export-json">JSON</button>
          <button id="export-csv">CSV</button>
        </div>
      </div>
      <div class="pills" id="pills" hidden></div>
      <div class="table-scroll">
        <table>
          <thead id="thead"></thead>
          <tbody id="tbody"></tbody>
        </table>
      </div>
      <div class="results-foot">
        <p class="muted" id="sources-note"></p>
        <div class="legend">
          <span class="muted">Confidence</span>
          <span class="legend-item"><span class="conf high"></span>High, 85% and up</span>
          <span class="legend-item"><span class="conf mid"></span>Medium, 65 to 84%</span>
          <span class="legend-item"><span class="conf low"></span>Low, under 65%</span>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <span>&copy; 2026 Srikar Prabhas Kandagatla</span>
    <a href="https://www.linkedin.com/in/srikar-prabhas-kandagatla/" target="_blank" rel="noopener">LinkedIn</a>
    <a href="https://github.com/srikarprabhaskandagatla" target="_blank" rel="noopener">GitHub</a>
    <a href="https://srikarprabhaskandagatla.github.io/" target="_blank" rel="noopener">Portfolio</a>
  </footer>
</div>

<div class="modal" id="modal" hidden>
  <div class="modal-box glass" role="dialog" aria-modal="true" aria-labelledby="modal-title">
    <div class="card-top">
      <p class="small-head" id="modal-title">Source</p>
      <button class="close" id="modal-close" aria-label="Close">x</button>
    </div>
    <div id="modal-body"></div>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
